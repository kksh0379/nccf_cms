<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" role="img" aria-labelledby="title desc" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif">
  <title id="title">웹어워드 코리아 2021 · 한살림 장보기 · 생활쇼핑몰분야 최우수상 수상 기록</title>
  <desc id="desc">웹어워드 코리아 공식 평가내역을 기반으로 재구성한 외부 수상 기록 카드</desc>
  <rect width="900" height="1300" fill="#f6f4ef"/>
  <rect x="54" y="54" width="792" height="1192" rx="10" fill="#ffffff" stroke="#173b58" stroke-width="5"/>
  <path d="M104 168h692M104 1132h692" stroke="#b7835d" stroke-width="3"/>

  <!-- kicker -->
  <text x="450" y="136" text-anchor="middle" fill="#7c8791" font-size="22" letter-spacing="7">EXTERNAL RECOGNITION</text>

  <!-- award title -->
  <text x="450" y="262" text-anchor="middle" fill="#102d47" font-size="60" font-weight="800">WEB AWARD KOREA</text>
  <text x="450" y="322" text-anchor="middle" fill="#b7835d" font-size="40" font-weight="700" letter-spacing="4">2021</text>

  <!-- medal -->
  <g transform="translate(450,430)">
    <path d="M-26 6 L-40 64 L-16 50 Z" fill="#173b58"/>
    <path d="M26 6 L40 64 L16 50 Z" fill="#b7835d"/>
    <circle cx="0" cy="0" r="42" fill="#b7835d" stroke="#173b58" stroke-width="4"/>
    <path d="M0 -22 L6.5 -7 L22 -6 L10 4 L14 20 L0 11 L-14 20 L-10 4 L-22 -6 L-6.5 -7 Z" fill="#fff"/>
  </g>

  <!-- award grade ribbon (hero) -->
  <rect x="150" y="520" width="600" height="92" rx="46" fill="#173b58"/>
  <text x="450" y="579" text-anchor="middle" fill="#ffffff" font-size="40" font-weight="800">생활쇼핑몰분야 최우수상</text>

  <!-- service -->
  <text x="450" y="712" text-anchor="middle" fill="#152536" font-size="52" font-weight="800">한살림 장보기</text>
  <text x="450" y="760" text-anchor="middle" fill="#5a6b78" font-size="26">shop.hansalim.or.kr · 생활쇼핑몰 온라인 서비스</text>

  <path d="M180 812h540" stroke="#e0dccf" stroke-width="2"/>

  <!-- participation -->
  <text x="450" y="864" text-anchor="middle" fill="#243b52" font-size="27" font-weight="700">참여 · (주)프레임아웃 기획팀</text>
  <text x="450" y="906" text-anchor="middle" fill="#5a6b78" font-size="25">서비스 기획 (김상화 매니저)</text>

  <!-- chips -->
  <g font-size="23" font-weight="700" text-anchor="middle">
    <rect x="192" y="962" width="180" height="56" rx="28" fill="#eef2f6" stroke="#c9d4de" stroke-width="1.5"/>
    <text x="282" y="998" fill="#40566b">쇼핑몰 부문</text>
    <rect x="392" y="962" width="150" height="56" rx="28" fill="#eef2f6" stroke="#c9d4de" stroke-width="1.5"/>
    <text x="467" y="998" fill="#40566b">데스크탑웹</text>
    <rect x="562" y="962" width="146" height="56" rx="28" fill="#eef2f6" stroke="#c9d4de" stroke-width="1.5"/>
    <text x="635" y="998" fill="#40566b">2021.08</text>
  </g>

  <!-- source note -->
  <text x="450" y="1088" text-anchor="middle" fill="#7c8791" font-size="23">웹어워드 코리아 공식 평가내역(iaward.or.kr) 기준</text>

  <!-- footer -->
  <text x="450" y="1192" text-anchor="middle" fill="#9aa4ac" font-size="21">공식 증서 대신 검증된 수상 이력을 재구성한 화면입니다.</text>
</svg>
