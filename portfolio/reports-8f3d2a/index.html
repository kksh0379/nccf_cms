<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>방문 통계 | 김상화 포트폴리오</title>
  <style>
    :root{--ink:#172536;--muted:#66778a;--paper:#f3f6f9;--card:#fff;--line:#ced8e3;--navy:#163451;--navy2:#091f35;--blue:#315f8c;--shadow:0 16px 44px rgba(9,31,53,.1)}
    *{box-sizing:border-box}html{font-size:16px}body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}button{font:inherit}.wrap{width:min(calc(100% - 32px),1120px);margin:auto}.top{padding:44px 0 72px;background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff}.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.eyebrow{margin:0 0 10px;color:#b9cfe0;font-weight:800}.top h1{margin:0;font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.05em}.top p{margin:14px 0 0;color:#d9e4ec}.logout{border:1px solid rgba(255,255,255,.35);border-radius:12px;background:transparent;color:#fff;padding:10px 14px;cursor:pointer}.content{margin-top:-34px;padding-bottom:60px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.metric,.panel{border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow)}.metric{padding:22px}.metric span{display:block;color:var(--muted);font-size:.88rem;font-weight:800}.metric strong{display:block;margin-top:4px;font-size:2rem}.panel{padding:22px;margin-top:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.panel h2{margin:0;font-size:1.25rem}.stamp{color:var(--muted);font-size:.82rem}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:640px}th,td{padding:13px 12px;border-bottom:1px solid #e4e9ef;text-align:left;white-space:nowrap}th{color:var(--muted);font-size:.82rem}td.num{text-align:right;font-variant-numeric:tabular-nums}.empty{padding:28px;text-align:center;color:var(--muted)}.error{display:none;margin:18px 0;padding:14px 16px;border:1px solid #e2a8a8;border-radius:12px;background:#fff1f1;color:#9f2424}.error.on{display:block}@media(max-width:680px){.top{padding-top:30px}.top-row{align-items:center}.summary{grid-template-columns:1fr}.metric{padding:18px}.panel{padding:16px}.logout{white-space:nowrap}}
  </style>
</head>
<body>
  <header class="top"><div class="wrap top-row"><div><p class="eyebrow">PRIVATE ANALYTICS</p><h1>방문 통계</h1><p>포트폴리오 페이지별 조회와 최근 방문 기록입니다.</p></div><button class="logout" id="logout" type="button">로그아웃</button></div></header>
  <main class="wrap content">
    <div class="error" id="error" role="alert"></div>
    <section class="summary" aria-label="요약 통계">
      <div class="metric"><span>전체 페이지뷰</span><strong id="totalPv">—</strong></div>
      <div class="metric"><span>오늘 페이지뷰</span><strong id="todayPv">—</strong></div>
      <div class="metric"><span>집계 페이지</span><strong id="pageCount">—</strong></div>
    </section>
    <section class="panel"><div class="panel-head"><h2>페이지별 통계</h2><span class="stamp">기준: 한국 시간</span></div><div class="table-wrap"><table><thead><tr><th>페이지 경로</th><th>전체 PV</th><th>오늘 PV</th></tr></thead><tbody id="pages"></tbody></table></div></section>
    <section class="panel"><div class="panel-head"><h2>최근 방문 로그</h2><span class="stamp" id="updated"></span></div><div class="table-wrap"><table><thead><tr><th>방문 시각</th><th>IP 주소</th><th>페이지 경로</th></tr></thead><tbody id="recent"></tbody></table></div></section>
  </main>
  <script>
    const API_BASE='https://nccf-portfolio-analytics.onrender.com',TOKEN_KEY='portfolioAdminToken';
    const token=sessionStorage.getItem(TOKEN_KEY);
    if(!token)location.replace('../');
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt=n=>new Intl.NumberFormat('ko-KR').format(Number(n)||0);
    async function load(){
      try{
        const r=await fetch(API_BASE+'/api/admin/stats',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
        if(r.status===401){sessionStorage.removeItem(TOKEN_KEY);location.replace('../');return}
        if(!r.ok)throw new Error('통계를 불러오지 못했습니다.');
        const d=await r.json(),pages=d.pages||[],recent=d.recent||[];
        document.getElementById('totalPv').textContent=fmt(pages.reduce((s,p)=>s+p.total,0));
        document.getElementById('todayPv').textContent=fmt(pages.reduce((s,p)=>s+p.today,0));
        document.getElementById('pageCount').textContent=fmt(pages.length);
        document.getElementById('pages').innerHTML=pages.length?pages.map(p=>`<tr><td>${esc(p.path)}</td><td class="num">${fmt(p.total)}</td><td class="num">${fmt(p.today)}</td></tr>`).join(''):'<tr><td class="empty" colspan="3">아직 수집된 방문 기록이 없습니다.</td></tr>';
        document.getElementById('recent').innerHTML=recent.length?recent.map(v=>`<tr><td>${esc(new Date(v.time).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}))}</td><td>${esc(v.ip)}</td><td>${esc(v.path)}</td></tr>`).join(''):'<tr><td class="empty" colspan="3">최근 방문 기록이 없습니다.</td></tr>';
        document.getElementById('updated').textContent='갱신 '+new Date().toLocaleTimeString('ko-KR');
      }catch(e){const el=document.getElementById('error');el.textContent=e.message;el.classList.add('on')}
    }
    document.getElementById('logout').addEventListener('click',()=>{sessionStorage.removeItem(TOKEN_KEY);location.replace('../')});
    load();
  </script>
</body>
</html>
