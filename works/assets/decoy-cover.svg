<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1296" viewBox="0 0 900 1296" role="img" aria-label="과정의 언어 표지">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#264a56"/>
      <stop offset="1" stop-color="#1a3742"/>
    </linearGradient>
  </defs>
  <style>
    .serif{font-family:'Nanum Myeongjo','Noto Serif KR','Apple SD Gothic Neo',serif}
    .sans{font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
  </style>
  <!-- 종이 바탕 -->
  <rect width="900" height="1296" fill="#efe9dd"/>
  <!-- 상단 색면 -->
  <rect x="0" y="0" width="900" height="560" fill="url(#band)"/>
  <!-- 색면 속 얇은 라인 모티프 -->
  <g stroke="#c9a24b" stroke-width="2" opacity="0.75">
    <line x1="120" y1="150" x2="500" y2="150"/>
    <line x1="120" y1="185" x2="420" y2="185"/>
    <line x1="120" y1="220" x2="470" y2="220"/>
  </g>
  <circle cx="700" cy="360" r="96" fill="none" stroke="#c9a24b" stroke-width="3" opacity="0.85"/>
  <text x="120" y="500" class="sans" fill="#dfe7ea" font-size="30" letter-spacing="10">ESSAY</text>
  <!-- 제목(가제) -->
  <text x="120" y="760" class="serif" fill="#22303a" font-size="118" font-weight="700" letter-spacing="4">과정의</text>
  <text x="120" y="890" class="serif" fill="#22303a" font-size="118" font-weight="700" letter-spacing="4">언어</text>
  <!-- 구분선 -->
  <line x1="123" y1="948" x2="300" y2="948" stroke="#c9784f" stroke-width="4"/>
  <!-- 부제 -->
  <text x="122" y="1010" class="sans" fill="#6a5f4e" font-size="36">기획자가 남긴 일의 기록</text>
  <!-- 저자 / 발행 -->
  <text x="122" y="1180" class="sans" fill="#33404a" font-size="42" letter-spacing="3">김상화 <tspan font-size="26" fill="#8a8271">지음</tspan></text>
</svg>
