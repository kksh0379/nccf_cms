<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1296" viewBox="0 0 900 1296" role="img" aria-label="과정의 언어 표지">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1e4a44"/>
      <stop offset="1" stop-color="#132e2a"/>
    </linearGradient>
  </defs>
  <style>
    .t{font-family:'Nanum Myeongjo','Apple SD Gothic Neo','Noto Serif KR',serif}
    .s{font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
  </style>
  <rect width="900" height="1296" fill="url(#bg)"/>
  <!-- 골드 프레임 -->
  <rect x="52" y="52" width="796" height="1192" fill="none" stroke="#c9a24b" stroke-width="2.5"/>
  <!-- 상단 라벨 -->
  <text x="450" y="210" text-anchor="middle" class="s" fill="#c9a24b" font-size="30" letter-spacing="10">ESSAY</text>
  <circle cx="450" cy="262" r="5" fill="#c9a24b"/>
  <!-- 제목(가제) -->
  <text x="450" y="620" text-anchor="middle" class="t" fill="#f4eede" font-size="128" letter-spacing="6">과정의 언어</text>
  <!-- 구분선 -->
  <line x1="360" y1="695" x2="540" y2="695" stroke="#c9a24b" stroke-width="3"/>
  <!-- 부제 -->
  <text x="450" y="770" text-anchor="middle" class="s" fill="#cdbf9e" font-size="38">기획자가 남긴 일의 기록</text>
  <!-- 저자 -->
  <text x="450" y="1120" text-anchor="middle" class="s" fill="#eadfc6" font-size="46" letter-spacing="4">김상화</text>
  <text x="450" y="1168" text-anchor="middle" class="s" fill="#8faea6" font-size="26">지음</text>
</svg>
