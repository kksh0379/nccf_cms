<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>비공개 페이지</title>
<style>
  :root{--green:#008b43}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;
    background:#f4f6f5;color:#222;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Arial,sans-serif}
  .gate{width:calc(100% - 40px);max-width:360px;background:#fff;border:1px solid #e3e6e4;border-radius:12px;
    padding:34px 28px 26px;box-shadow:0 12px 40px rgba(0,0,0,.08);text-align:center}
  .gate .lock{font-size:30px;margin-bottom:12px}
  .gate h1{margin:0 0 8px;font-size:18px;font-weight:700}
  .gate p{margin:0 0 20px;font-size:13px;line-height:1.6;color:#666}
  .gate input{width:100%;height:46px;border:1px solid #ccc;border-radius:8px;padding:0 14px;font-size:15px}
  .gate input:focus{outline:none;border-color:var(--green)}
  .gate button{width:100%;height:46px;margin-top:12px;border:0;border-radius:8px;background:var(--green);
    color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  .gate button:disabled{background:#c9d6cf;cursor:not-allowed}
  .gate .err{min-height:18px;margin-top:12px;font-size:12.5px;color:#d02b2b}
</style>
</head>

  <form class="gate" id="gate" autocomplete="off">

    <input type="password" id="pw" placeholder="비밀번호" aria-label="비밀번호" autofocus>
    <button type="submit" id="go">확인</button>
    <div class="err" id="err"></div>
  </form>

  function b64d(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
  async function decryptWith(pw){
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(DATA.iv)},key,b64d(DATA.ct));
    return new TextDecoder().decode(pt);
  }
  function render(htmlStr){
    document.open();document.write(htmlStr);document.close();
  }
  var form=document.getElementById('gate'),pwEl=document.getElementById('pw'),
      go=document.getElementById('go'),err=document.getElementById('err');
  async function attempt(pw,silent){
    err.textContent='';go.disabled=true;
    try{
      var html=await decryptWith(pw);
      try{sessionStorage.setItem('bpk',pw);}catch(e){}
      render(html);
    }catch(e){
      go.disabled=false;
      if(!silent){err.textContent='비밀번호가 올바르지 않습니다.';pwEl.select();}
    }
  }
  form.addEventListener('submit',function(e){e.preventDefault();var v=pwEl.value;if(v)attempt(v,false);});
  // 같은 세션 내 재방문 시 자동 해제(편의)
  (function(){try{var s=sessionStorage.getItem('bpk');if(s)attempt(s,true);}catch(e){}})();
